name: Update list

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours, off the top of the hour to avoid GitHub's busy slot
  workflow_dispatch:

permissions:
  contents: write            # only what is needed to push the list commit

concurrency:
  group: update-list
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: node scripts/update-list.js

      - name: Commit if the list changed
        run: |
          git add list
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(list): update X list ($(wc -l < list/x.txt) accounts)"
          git push
